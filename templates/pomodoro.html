{% extends "base.html" %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div class="row mb-4 align-items-center">
    <div class="col-12">
        <h2 class="fw-bold m-0">Pomodoro</h2>
    </div>
</div>

<div class="row g-4">
    <div class="col-lg-5">
        <div class="card p-5 text-center h-100 shadow-sm border">

            <h1 class="display-1 fw-bold mb-4 text-dark" id="timer-display">5:00</h1>

            <div class="form-check form-switch d-flex justify-content-center mb-4 align-items-center gap-2">
                <input class="form-check-input" type="checkbox" id="rainSwitch" style="cursor: pointer;">
                <label class="form-check-label text-muted" for="rainSwitch">Dźwięk deszczu</label>
            </div>

            <div class="d-flex gap-2 justify-content-center">
                <button onclick="startTimer()" class="btn btn-primary px-5 rounded-pill fw-bold">Start</button>
                <button onclick="resetTimer()" class="btn btn-outline-secondary px-4 rounded-pill">Reset</button>
            </div>

            <p id="status-msg" class="mt-3 text-success fw-bold small" style="min-height: 20px;"></p>
        </div>
    </div>

    <div class="col-lg-7">

        <div class="row mb-3 g-3">
            <div class="col-6">
                <div class="card p-3 text-center bg-light border shadow-sm h-100">
                    <h3 class="fw-bold m-0 text-primary">{{ total_minutes or 0 }}</h3>
                    <small class="text-muted text-uppercase" style="font-size: 0.7rem;">Minut łącznie</small>
                </div>
            </div>
            <div class="col-6">
                <div class="card p-3 text-center bg-light border shadow-sm h-100">
                    <h3 class="fw-bold m-0 text-success">{{ total_sessions or 0 }}</h3>
                    <small class="text-muted text-uppercase" style="font-size: 0.7rem;">Ukończonych sesji</small>
                </div>
            </div>
        </div>

        <div class="card p-4 shadow-sm border">
            <h5 class="fw-bold mb-3">Historia aktywności</h5>
            <canvas id="myChart" height="200"></canvas>
        </div>
    </div>
</div>

<audio id="rain-sound" loop src="https://actions.google.com/sounds/v1/weather/rain_heavy_loud.ogg"></audio>
<audio id="alarm-sound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script>
    var timer;
    var timeLeft = 5 * 60;
    var isRunning = false;

    var display = document.getElementById('timer-display');
    var rainAudio = document.getElementById('rain-sound');
    var alarmAudio = document.getElementById('alarm-sound');
    var rainSwitch = document.getElementById('rainSwitch');

    rainAudio.volume = 0.4;

    function updateDisplay() {
        var m = Math.floor(timeLeft / 60);
        var s = timeLeft % 60;
        if (m < 10) m = "0" + m;
        if (s < 10) s = "0" + s;
        display.innerText = m + ":" + s;
    }

    function startTimer() {
        if(isRunning) return;
        isRunning = true;

        if(rainSwitch.checked) {
            rainAudio.play().catch(function(e) { console.log("Audio error"); });
        }

        timer = setInterval(function() {
            if(timeLeft > 0) {
                timeLeft--;
                updateDisplay();
            } else {
                finish();
            }
        }, 1000);
    }

    function finish() {
        clearInterval(timer);
        isRunning = false;
        rainAudio.pause();
        alarmAudio.play();

        document.getElementById('status-msg').innerText = "Zapisywanie";

        fetch('/save_pomodoro', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({minutes: 5})
        }).then(function() {
            setTimeout(function() {
                location.reload();
            }, 1000);
        });
    }

    function resetTimer() {
        clearInterval(timer);
        isRunning = false;
        timeLeft = 5 * 60;
        updateDisplay();
        rainAudio.pause();
        rainAudio.currentTime = 0;
        document.getElementById('status-msg').innerText = "";
    }

    rainSwitch.addEventListener('change', function() {
        if(isRunning) {
            this.checked ? rainAudio.play() : rainAudio.pause();
        }
    });

    var ctx = document.getElementById('myChart').getContext('2d');
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: {{ labels | tojson }},
            datasets: [{
                label: 'Minuty',
                data: {{ values | tojson }},
                backgroundColor: '#0d6efd',
                borderRadius: 4
            }]
        },
        options: {
            scales: { y: { beginAtZero: true } },
            plugins: { legend: { display: false } }
        }
    });
</script>
{% endblock %}
