<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Przypomnienia</title>
    <script src="/static/reminder.js"></script>
</head>
<body>

<a href="/">back</a>

<h1>⏰ Przypomnienia</h1>

<div class="card">
<form method="POST" action="/reminders/create">
    <input name="task_id" placeholder="Task ID" required>
    <input type="datetime-local" name="notify_at" required>
    <input name="type" value="push">
    <button>Dodaj</button>
</form>
</div>

{% for r in reminders %}
<div class="card">
    <strong>Task #{{ r.task_id }}</strong><br>
    {{ r.notify_at }}<br>
    Typ: {{ r.type }}

    <form method="POST" action="/reminders/delete/{{ r.id }}">
        <button class="danger">Usuń</button>
    </form>
</div>
{% else %}
<p>Brak przypomnień</p>
{% endfor %}
</body>
